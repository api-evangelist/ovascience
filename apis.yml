name: OvaScience
description: 'OvaScience was a Waltham, Massachusetts biotechnology company founded in 2011 (by Michelle
  Dipp, Richard Aldrich, Christoph Westphal, Jonathan Tilly, and David Sinclair) that developed fertility
  and assisted-reproduction treatments for female infertility. Its two marquee IVF services were Augment
  (autologous mitochondrial transfer into a patient''s egg) and OvaTure (maturing egg-precursor stem cells
  into eggs), launched in clinics in the UAE, Canada, and Japan starting in 2014. The company was surfaced
  as a portfolio company of Bessemer Venture Partners and added to the API Evangelist network as a stub for
  enrichment. OvaScience is defunct: in August 2018 it merged with Millendo Therapeutics via a reverse
  merger. It publishes no developer API, no OpenAPI, and no developer/documentation surface; its former
  domain (ovascience.com) now resolves to a parked lander.'
